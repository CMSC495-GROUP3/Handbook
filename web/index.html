<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png?v=4" />
    <meta name="theme-color" content="#F9F6F1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sourcebook</title>
    <meta name="description" content="Answers to employee policy questions, with the policy each answer came from." />
    <!-- Apply the saved theme (or the system one) before the first paint. Mirrors src/lib/theme.ts. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme')
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#1E1A16' : '#F9F6F1')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
